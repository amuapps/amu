<title>Auto Mitra Utama-Vespa Indonesia</title>
<meta name="description" content="Katalog Vespa. Temukan model, harga, test ride, dan dealer terdekat.">

<style>
:root{
  --ink:#0d0d0d;
  --paper:#ffffff;
  --smoke:#f4f4f4;
  --line:#e2e2e2;
  --mute:#8a8a8a;
  --accent:#0d0d0d;
  --top:34px;
  --nav:64px;
  --disp:'Barlow Condensed',Impact,sans-serif;
  --body:'Barlow',Helvetica,Arial,sans-serif;
  --ok:#25d366;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:2px}

/* ---------- TOP BAR ---------- */
.topbar{height:var(--top);background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:22px;padding:0 18px;font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;position:fixed;top:0;left:0;right:0;z-index:60}
.topbar a{opacity:.75;transition:opacity .2s}
.topbar a:hover{opacity:1}
.topbar .lang b{opacity:1}
.topbar .lang{opacity:1}

/* ---------- HEADER ---------- */
.header{position:fixed;top:var(--top);left:0;right:0;height:var(--nav);z-index:59;display:flex;align-items:center;justify-content:space-between;padding:0 18px;transition:background .3s,box-shadow .3s;background:transparent}
.header.solid{background:#fff;box-shadow:0 1px 0 var(--line)}
.brand{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.28em;text-transform:uppercase;color:#fff;transition:color .3s;padding-left:.28em}
.header.solid .brand{color:var(--ink)}
.mainnav{display:none;gap:26px;font-family:var(--disp);font-size:15px;letter-spacing:.13em;text-transform:uppercase}
.mainnav a{position:relative;color:#fff;transition:color .3s;padding:6px 0}
.header.solid .mainnav a{color:var(--ink)}
.mainnav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s}
.mainnav a:hover::after{transform:scaleX(1)}
.burger{width:34px;height:24px;position:relative}
.burger span{position:absolute;left:0;right:0;height:2px;background:#fff;transition:.3s}
.header.solid .burger span{background:var(--ink)}
.burger span:nth-child(1){top:0}
.burger span:nth-child(2){top:11px}
.burger span:nth-child(3){top:22px}
body.menu-open .burger span:nth-child(1){top:11px;transform:rotate(45deg);background:#fff}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){top:11px;transform:rotate(-45deg);background:#fff}

/* ---------- DRAWER ---------- */
.drawer{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:58;padding:calc(var(--top) + var(--nav) + 20px) 24px 40px;transform:translateY(-100%);transition:transform .45s cubic-bezier(.7,0,.2,1);overflow-y:auto}
body.menu-open .drawer{transform:translateY(0)}
.drawer a{display:block;font-family:var(--disp);font-size:26px;letter-spacing:.1em;text-transform:uppercase;padding:14px 0;border-bottom:1px solid #222}
.drawer .sub{margin-top:26px;font-size:13px;letter-spacing:.16em;color:var(--mute)}
.drawer .sub a{font-size:15px;border:0;padding:8px 0;color:#fff}

/* ---------- HERO ---------- */
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden;background:#111}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex;align-items:flex-end}
.slide.on{opacity:1}
.slide .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.slide .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.72) 100%)}
.slide .cap{position:relative;padding:0 24px 92px;max-width:760px;color:#fff}
.slide .eyebrow{font-family:var(--disp);font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.85;margin-bottom:10px}
.slide h2{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(34px,8vw,72px);line-height:.95;letter-spacing:.02em}
.slide p{margin-top:12px;font-weight:300;font-size:16px;opacity:.9;max-width:46ch}
.btn-line{display:inline-block;margin-top:20px;font-family:var(--disp);font-size:14px;letter-spacing:.18em;text-transform:uppercase;border:1px solid #fff;padding:12px 30px;transition:.25s}
.btn-line:hover{background:#fff;color:#000}
.hero-nav{position:absolute;bottom:34px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots i{width:26px;height:2px;background:rgba(255,255,255,.35);cursor:pointer;transition:.3s}
.dots i.on{background:#fff}
.arrows{display:flex;gap:8px}
.arrows button{width:42px;height:42px;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:18px;line-height:1;transition:.25s}
.arrows button:hover{background:#fff;color:#000}
.hero-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--disp);letter-spacing:.2em;text-transform:uppercase;font-size:13px}

/* ---------- SECTION ---------- */
.sec{padding:74px 20px}
.sec-head{text-align:center;margin-bottom:34px}
.sec-head h3{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(26px,5vw,42px);letter-spacing:.04em}
.sec-head span{display:block;font-family:var(--disp);font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin-top:8px}

/* ---------- RANGE ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:26px;scrollbar-width:none;justify-content:flex-start}
.filters::-webkit-scrollbar{display:none}
.filters button{white-space:nowrap;font-family:var(--disp);font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:9px 18px;border:1px solid var(--line);transition:.2s}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--smoke);padding:16px 14px 20px;text-align:center;transition:.3s;position:relative;overflow:hidden}
